<title>Voice Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Alegreya+Sans:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: wide dungeon stage on top (enemy centered and huge, party lined up along the bottom edge),
   then a command window bottom-left and a party status window bottom-right. Dark single-look design by choice. */
:root {
  --bg: #0f0c0f;
  --panel: #1a1418;
  --panel-hi: #261d22;
  --line: #75605a;
  --line-soft: #3b2f31;
  --text: #ecdfcc;
  --muted: #a09084;
  --ember: #f08a3c;
  --atb: #79c0de;
  --body: #cf5143;
  --mind: #6a8be0;
  --good: #86b873;
  --font-display: 'Almendra SC', Georgia, serif;
  --font-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --font-num: 'Share Tech Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.35;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.game { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font: 400 1.6rem/1 var(--font-display); letter-spacing: .04em; text-wrap: balance; }
.top p { margin: 0; color: var(--muted); font-size: .95rem; min-width: 0; }
.top q { color: var(--text); quotes: "\201C" "\201D"; }

.win {
  background: linear-gradient(180deg, var(--panel-hi), var(--panel));
  border: 2px solid var(--line);
  border-radius: 6px;
  box-shadow: inset 0 0 0 2px #0c090b, inset 0 0 0 3px var(--line-soft);
  padding: 12px;
  min-width: 0;
}

/* stage */
.stage-wrap { display: flex; justify-content: center; }
.stage {
  position: relative;
  width: min(100%, calc(58vh * 400 / 240));
  min-width: 280px;
  aspect-ratio: 400 / 240;
  border: 2px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 0 0 1px #0c090b, 0 0 0 3px var(--line-soft);
  overflow: hidden;
  background: #120e10;
}
.stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.foe { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: min(62%, 340px); text-align: center; pointer-events: none; }
.foe-name { font: 400 .95rem/1 var(--font-display); letter-spacing: .1em; text-shadow: 0 1px 3px #000; }
.foe-hp { margin-top: 4px; height: 7px; background: #1b0f10; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.foe-hp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #8d2b24, var(--body)); transition: width .25s; }
.banner { margin-top: 6px; opacity: 0; transition: opacity .15s; font: 700 .85rem/1.1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ember); text-shadow: 0 1px 3px #000; }
.banner.on { opacity: 1; }
.banner .wind { margin: 3px auto 0; width: 60%; height: 4px; background: #1b0f10; border-radius: 2px; overflow: hidden; }
.banner .wind i { display: block; height: 100%; width: 0; background: var(--ember); }
.over[hidden] { display: none; }
.over { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; background: rgba(8, 5, 7, .78); text-align: center; }
.over h2 { margin: 0; font: 400 clamp(1.6rem, 5vw, 2.6rem)/1 var(--font-display); letter-spacing: .06em; }
.over p { margin: 0; color: var(--muted); }
.btn { border: 2px solid var(--line); background: var(--panel-hi); border-radius: 4px; padding: 7px 14px; cursor: pointer; font-weight: 700; letter-spacing: .03em; }
.btn:hover { border-color: var(--ember); }
.btn.primary { background: #5a2d17; border-color: var(--ember); }

/* voice strip */
.strip { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-items: center; }
.strip .mic { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mic-btn { display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.mic-btn[aria-pressed="true"] .dot { background: var(--body); box-shadow: 0 0 0 0 rgba(207, 81, 67, .7); animation: ping 1.4s infinite; }
@keyframes ping { to { box-shadow: 0 0 0 8px rgba(207, 81, 67, 0); } }
.status { color: var(--muted); font-size: .9rem; min-width: 0; }
.heard { min-width: 0; font-size: 1rem; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.heard .h { color: var(--muted); font-style: italic; }
.heard .r { color: var(--text); font-weight: 500; }
.heard .r.bad { color: #e49a7e; }
.strip form { display: flex; gap: 8px; }
.strip input[type=text] { flex: 1; min-width: 0; background: #120d10; color: var(--text); border: 1px solid var(--line-soft); border-radius: 4px; padding: 7px 10px; font: inherit; }
.mode { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); cursor: pointer; }
.mode input { accent-color: var(--ember); }

/* windows */
.windows { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 10px; align-items: stretch; }
.cmd h3 { margin: 0 0 8px; font: 400 1.05rem/1 var(--font-display); letter-spacing: .08em; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.cmd h3 span { font: 500 .8rem/1 var(--font-body); letter-spacing: .06em; color: var(--atb); text-transform: uppercase; }
.cmd h3 span.wait { color: var(--muted); }
.cmds { display: flex; flex-direction: column; gap: 4px; }
.cmd-row { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 5px 8px; cursor: pointer; }
.cmd-row:hover { background: rgba(255, 255, 255, .05); }
.cmd-row b { font-weight: 700; font-size: 1.05rem; }
.cmd-row .cost { font: .85rem var(--font-num); color: var(--mind); align-self: center; }
.cmd-row small { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; }
.cmd-row.no { opacity: .45; }
.cmd-row.queued { border-color: var(--atb); background: rgba(121, 192, 222, .1); }

.party { display: flex; flex-direction: column; gap: 8px; }
.member { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; align-items: center; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 6px 8px; cursor: pointer; }
.member:hover { background: rgba(255, 255, 255, .04); }
.member.sel { border-color: var(--line); background: rgba(255, 255, 255, .06); }
.member .nm { font: 400 1.25rem/1.05 var(--font-display); letter-spacing: .04em; }
.member .nm small { display: block; font: 500 .72rem/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.member.down .nm { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.stat { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; min-width: 0; }
.stat label { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 400 1rem var(--font-num); min-width: 2.3ch; text-align: right; font-variant-numeric: tabular-nums; }
.bar { display: block; height: 6px; background: #120d10; border: 1px solid var(--line-soft); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; }
.stat.body .bar i { background: var(--body); }
.stat.mind .bar i { background: var(--mind); }
.atb { grid-column: 1 / -1; position: relative; height: 8px; background: #120d10; border: 1px solid var(--line-soft); border-radius: 2px; overflow: hidden; }
.atb i { display: block; height: 100%; width: 0; background: var(--atb); }
.member.ready .atb { border-color: var(--ember); }
.member.ready .atb i { background: var(--ember); animation: glow 0.9s ease-in-out infinite alternate; }
@keyframes glow { to { filter: brightness(1.45); } }

@media (max-width: 680px) {
  .windows { grid-template-columns: minmax(0, 1fr); }
  .member { grid-template-columns: 5rem minmax(0, 1fr); }
  .member .stat.mind { grid-column: 2; }
  .stage { aspect-ratio: 400 / 260; }
}
@media (prefers-reduced-motion: reduce) {
  .mic-btn[aria-pressed="true"] .dot, .member.ready .atb i { animation: none; }
}
</style>

<div class="game">
  <header class="top">
    <h1>Voice Battle</h1>
    <p>Say a name, then a command: <q>Kevin, heal</q> or <q>Matthew, block</q>.</p>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="c" width="400" height="240" aria-label="Battle scene: the Kiln Warden stands in the middle of a brick tunnel, with Kevin, Matthew and Ian in front"></canvas>
      <div class="foe">
        <div class="foe-name">Kiln Warden</div>
        <div class="foe-hp"><i id="foeHp"></i></div>
        <div class="banner" id="banner"><span id="bannerText"></span><div class="wind"><i id="windBar"></i></div></div>
      </div>
      <div class="over" id="over" hidden>
        <h2 id="overTitle"></h2>
        <p id="overSub"></p>
        <button class="btn primary" id="again" type="button">Fight again</button>
      </div>
    </div>
  </div>

  <section class="win strip" aria-label="Voice input">
    <div class="mic">
      <button class="btn mic-btn" id="mic" type="button" aria-pressed="false"><span class="dot"></span><span id="micLabel">Start listening</span></button>
      <label class="mode"><input type="checkbox" id="wait" checked> Wait mode</label>
      <span class="status" id="micStatus">Mic off. You can also type or tap commands.</span>
    </div>
    <div class="heard" aria-live="polite"><span class="h" id="heard">Nothing heard yet.</span><span class="r" id="result"></span></div>
    <form id="typed" autocomplete="off">
      <input type="text" id="typedCmd" placeholder="Type a command, such as Ian flurry" aria-label="Type a command">
      <button class="btn" type="submit">Send</button>
    </form>
  </section>

  <div class="windows">
    <section class="win cmd" aria-label="Commands">
      <h3><b id="cmdWho" style="font-weight:400">Kevin</b><span id="cmdState">Waiting</span></h3>
      <div class="cmds" id="cmds"></div>
    </section>
    <section class="win party" id="party" aria-label="Party"></section>
  </div>
</div>
<script>
(() => {
'use strict';
const W = 400, H = 240;

/* ---------- data ---------- */
const SKILLS = {
  attack: { label: 'Attack', cost: 0,  desc: 'A plain strike.' },
  block:  { label: 'Block',  cost: 0,  desc: 'Take 60% less damage for 6 seconds.' },
  heal:   { label: 'Heal',   cost: 12, desc: 'Restore Body to an ally. Add a name to pick who.' },
  bolt:   { label: 'Bolt',   cost: 14, desc: 'Lightning for heavy damage.' },
  revive: { label: 'Revive', cost: 25, desc: 'Raise a fallen ally.' },
  bash:   { label: 'Bash',   cost: 10, desc: 'Heavy hit that sets the Warden back.' },
  taunt:  { label: 'Taunt',  cost: 5,  desc: 'Draws the Warden’s next two slams.' },
  flurry: { label: 'Flurry', cost: 8,  desc: 'Three fast cuts.' },
  quick:  { label: 'Quick cut', cost: 0, desc: 'Light hit. Refunds half the gauge.' }
};

const DEFS = [
  { id: 'kevin',   name: 'Kevin',   role: 'Mender', maxHp: 90,  maxMp: 80, spd: 1.05, atk: [8, 12],  x: 72,
    skills: ['attack', 'block', 'heal', 'bolt', 'revive'] },
  { id: 'matthew', name: 'Matthew', role: 'Knight', maxHp: 130, maxMp: 40, spd: 0.9,  atk: [16, 22], x: 200,
    skills: ['attack', 'block', 'bash', 'taunt'] },
  { id: 'ian',     name: 'Ian',     role: 'Rogue',  maxHp: 100, maxMp: 50, spd: 1.3,  atk: [12, 16], x: 328,
    skills: ['attack', 'block', 'flurry', 'quick'] }
];
const DEF = id => DEFS.find(d => d.id === id);
const GAUGE_SECONDS = 6;
const rnd = (a, b) => Math.floor(a + Math.random() * (b - a + 1));

/* ---------- voice command parser ---------- */
const NAME_ALIASES = {
  kevin:   ['kevin', 'kevan', 'kevyn', 'keven', 'kev', 'cavin', 'kelvin', 'kevins'],
  matthew: ['matthew', 'mathew', 'matt', 'matthews', 'mathieu', 'mat', 'matthew’s'],
  ian:     ['ian', 'iain', 'eon', 'ion', 'ean', 'yan', 'eyan', 'ayan']
};
const ACTION_ALIASES = {
  attack: ['attack', 'attacks', 'attacked', 'hit', 'strike', 'slash', 'fight', 'swing', 'attach'],
  block:  ['block', 'blocks', 'blocked', 'blog', 'guard', 'defend', 'shield', 'brace'],
  heal:   ['heal', 'heals', 'healed', 'healing', 'heel', 'cure', 'mend', 'hill'],
  bolt:   ['bolt', 'bolts', 'bold', 'fire', 'zap', 'lightning', 'thunder', 'shock'],
  revive: ['revive', 'revives', 'revived', 'raise', 'resurrect', 'rez'],
  bash:   ['bash', 'bashes', 'smash', 'bashed'],
  taunt:  ['taunt', 'taunts', 'taunted', 'tont'],
  flurry: ['flurry', 'flurries', 'flurrys', 'furry'],
  quick:  ['quick', 'quickly', 'quik', 'fast']
};
const ALL_WORDS = ['everyone', 'everybody', 'all', 'team', 'party', 'together'];
const PRIORITY = ['heal', 'revive', 'bolt', 'bash', 'taunt', 'flurry', 'quick', 'block', 'attack'];

function norm(s) {
  return String(s).toLowerCase().replace(/[’]/g, "'").replace(/'s\b/g, '')
    .replace(/[^a-z0-9' ]/g, ' ').replace(/\bi an\b/g, 'ian').replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 2) return 9;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function matchToken(tok, table) {
  for (const key in table) if (table[key].includes(tok)) return key;
  if (tok.length >= 5) for (const key in table) for (const al of table[key]) if (al.length >= 5 && lev(tok, al) <= 1) return key;
  return null;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function parseCommand(text) {
  const toks = norm(text).split(' ').filter(Boolean);
  const names = [], actions = [];
  let all = false;
  for (const tok of toks) {
    const n = matchToken(tok, NAME_ALIASES);
    if (n) { names.push(n); continue; }
    if (ALL_WORDS.includes(tok)) { all = true; continue; }
    const a = matchToken(tok, ACTION_ALIASES);
    if (a) actions.push(a);
  }
  if (!actions.length) {
    return { ok: false, reason: names.length ? `${cap(names[0])}… what should they do?` : 'No command heard.' };
  }
  const action = PRIORITY.find(a => actions.includes(a));
  if (all && action === 'block') return { ok: true, all: true, action };
  const canDo = id => DEF(id).skills.includes(action);
  const owners = DEFS.filter(d => d.skills.includes(action));
  let actor = null, target = null;
  if (names.length) {
    actor = names[0];
    if (!canDo(actor) && names[1] && canDo(names[1])) { actor = names[1]; target = names[0]; }
    else target = names.find(n => n !== actor) || null;
    if (!canDo(actor) && owners.length === 1 && (action === 'heal' || action === 'revive')) { target = actor; actor = owners[0].id; }
  } else if (owners.length === 1) {
    actor = owners[0].id;
  }
  if (!actor) return { ok: false, reason: `Say a name first, like “${DEFS[0].name}, ${SKILLS[action].label.toLowerCase()}”.` };
  return { ok: true, actor, action, target };
}

/* ---------- battle state ---------- */
let S;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function newGame() {
  S = {
    t: 0, over: null, overT: 0, shake: 0, manual: false,
    wait: document.getElementById('wait').checked,
    selected: 'kevin',
    heroes: DEFS.map(d => ({
      ...d, hp: d.maxHp, mp: d.maxMp, gauge: 0.25 + Math.random() * 0.35, ready: false,
      guardUntil: 0, queued: null, ko: false, anim: null, hitT: -9, readyT: 0
    })),
    enemy: { hp: 720, max: 720, gauge: 0.15, wind: null, hitT: -9, slamT: -9, taunt: { id: null, n: 0 }, enraged: false },
    floaters: [], parts: [], timers: []
  };
  document.getElementById('over').hidden = true;
}

const heroById = id => S.heroes.find(h => h.id === id);
const living = () => S.heroes.filter(h => !h.ko);

function floater(x, y, text, color) { S.floaters.push({ x, y, text, color, t0: S.t, life: 1 }); }

function hurtEnemy(d, who) {
  const e = S.enemy;
  e.hp = Math.max(0, e.hp - d);
  e.hitT = S.t;
  floater(200 + rnd(-24, 24), 84 + rnd(-8, 8), String(d), '#ffe9b0');
  if (!e.enraged && e.hp <= e.max * 0.4 && e.hp > 0) {
    e.enraged = true;
    say('The furnace roars. The Warden moves faster.', true);
  }
  if (e.hp <= 0) endGame('win');
}

function hurtHero(h, d) {
  if (h.ko) return;
  if (h.guardUntil > S.t) d = Math.round(d * 0.4);
  h.hp = Math.max(0, h.hp - d);
  h.hitT = S.t;
  S.shake = Math.max(S.shake, d > 30 ? 3 : 1.5);
  floater(h.x, 196, String(d), '#ff8a78');
  if (h.hp <= 0) {
    h.ko = true; h.ready = false; h.gauge = 0; h.queued = null;
    if (!living().length) endGame('lose');
  }
}

function endGame(kind) {
  S.over = kind; S.overT = S.t;
  const win = kind === 'win';
  document.getElementById('overTitle').textContent = win ? 'The Warden falls' : 'The party has fallen';
  document.getElementById('overSub').textContent = win ? 'The furnace goes dark.' : 'The Kiln Warden stands over the tunnel.';
  setTimeout(() => { if (S.over === kind) document.getElementById('over').hidden = false; }, win ? 1800 : 900);
}

function healTarget(targetId) {
  const t = targetId && heroById(targetId);
  if (t && !t.ko) return t;
  return living().sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0];
}

/* returns true when the action was spent */
function perform(h, skill, targetId) {
  const sk = SKILLS[skill];
  if (h.mp < sk.cost) { say(`${h.name} lacks the Mind for ${sk.label}.`, true); return false; }
  let anim = 'melee', refund = 0;
  switch (skill) {
    case 'attack': hurtEnemy(rnd(h.atk[0], h.atk[1])); break;
    case 'quick':  hurtEnemy(rnd(8, 12)); refund = 0.5; break;
    case 'bash':
      hurtEnemy(rnd(28, 38));
      if (S.enemy.wind) S.enemy.wind.t = Math.max(0, S.enemy.wind.t - 0.7); else S.enemy.gauge = Math.max(0, S.enemy.gauge - 0.3);
      break;
    case 'flurry':
      for (let i = 0; i < 3; i++) S.timers.push({ at: S.t + 0.18 * i, fn: () => { if (!S.over) hurtEnemy(rnd(8, 11)); } });
      break;
    case 'bolt': anim = 'cast'; hurtEnemy(rnd(34, 44)); break;
    case 'block': anim = 'cast'; h.guardUntil = S.t + 6; floater(h.x, 180, 'Guard', '#79c0de'); break;
    case 'taunt': anim = 'cast'; S.enemy.taunt = { id: h.id, n: 2 }; floater(h.x, 180, 'Taunt', '#f0b45c'); break;
    case 'heal': {
      anim = 'cast';
      const t = healTarget(targetId);
      if (!t) return false;
      const amt = rnd(40, 50), before = t.hp;
      t.hp = Math.min(t.maxHp, t.hp + amt);
      floater(t.x, 190, '+' + Math.round(t.hp - before), '#a6dc90');
      t.hitT = -9;
      break;
    }
    case 'revive': {
      anim = 'cast';
      const t = (targetId && heroById(targetId) && heroById(targetId).ko) ? heroById(targetId) : S.heroes.find(x => x.ko);
      if (!t) { say('No one has fallen.', true); return false; }
      t.ko = false; t.hp = Math.round(t.maxHp * 0.4); t.gauge = 0; t.ready = false;
      floater(t.x, 190, 'Revived', '#a6dc90');
      break;
    }
  }
  h.mp -= sk.cost;
  h.ready = false;
  h.gauge = refund;
  h.anim = { kind: anim, t0: S.t, skill };
  return true;
}

function issue(h, skill, targetId) {
  if (S.over) return false;
  const sk = SKILLS[skill];
  if (h.ko) { say(`${h.name} is down.`, true); return false; }
  if (!h.skills.includes(skill)) { say(`${h.name} can’t ${sk.label.toLowerCase()}.`, true); return false; }
  if (h.ready) {
    const ok = perform(h, skill, targetId);
    if (ok) say(`${h.name}: ${sk.label}${targetId && (skill === 'heal' || skill === 'revive') ? ' on ' + DEF(targetId).name : ''}`);
    return ok;
  }
  h.queued = { skill, target: targetId };
  say(`${h.name}: ${sk.label} queued until the gauge fills.`);
  return true;
}

function runParsed(p) {
  if (p.all) { living().forEach(h => issue(h, 'block')); return; }
  issue(heroById(p.actor), p.action, p.target);
  S.selected = p.actor;
}

/* ---------- enemy ---------- */
function startWind() {
  const e = S.enemy;
  const sweep = e.enraged ? Math.random() < 0.55 : Math.random() < 0.3;
  let target = null;
  if (!sweep) {
    const t = e.taunt.n > 0 && heroById(e.taunt.id);
    const pool = living();
    target = (t && !t.ko) ? t : pool[Math.floor(Math.random() * pool.length)];
  }
  e.wind = { kind: sweep ? 'sweep' : 'slam', dur: sweep ? 2.0 : 1.5, t: 0, target: target && target.id };
}

function resolveEnemy() {
  const e = S.enemy, w = e.wind;
  e.slamT = S.t;
  e.lastKind = w.kind;
  S.shake = 4;
  if (w.kind === 'sweep') {
    living().forEach(h => hurtHero(h, rnd(16, 22)));
  } else {
    let t = heroById(w.target);
    if (!t || t.ko) t = living()[0];
    if (t) hurtHero(t, rnd(38, 48));
    if (e.taunt.n > 0) e.taunt.n--;
  }
  e.wind = null;
  e.gauge = 0;
}

/* ---------- simulation ---------- */
function update(dt) {
  S.t += dt;
  S.shake *= Math.pow(0.001, dt);
  S.floaters = S.floaters.filter(f => S.t - f.t0 < 0.95);
  S.timers = S.timers.filter(tm => { if (S.t >= tm.at) { tm.fn(); return false; } return true; });
  updateParticles(dt);
  if (S.over) return;

  const anyReady = S.heroes.some(h => h.ready && !h.ko);
  const waiting = S.wait && anyReady;

  for (const h of S.heroes) {
    if (h.ko) continue;
    h.mp = Math.min(h.maxMp, h.mp + dt * 0.6);
    if (!h.ready) {
      h.gauge += dt * h.spd / GAUGE_SECONDS;
      if (h.gauge >= 1) {
        h.gauge = 1; h.ready = true; h.readyT = S.t;
        if (!S.manual || !heroById(S.selected).ready) S.selected = h.id;
      }
    }
    if (h.ready && h.queued) {
      const q = h.queued; h.queued = null;
      perform(h, q.skill, q.target);
    }
  }
  if (S.over) return;

  if (!waiting) {
    const e = S.enemy;
    if (e.wind) { e.wind.t += dt; if (e.wind.t >= e.wind.dur) resolveEnemy(); }
    else {
      e.gauge += dt / 6.5 * (e.enraged ? 1.4 : 1);
      if (e.gauge >= 1) startWind();
    }
  }
}

function updateParticles(dt) {
  const e = S.enemy;
  if (!S.over || S.over === 'lose') {
    if (Math.random() < dt * 8) S.parts.push({ k: 'ember', x: 200 + rnd(-16, 16), y: 140 + rnd(-10, 10), vx: rnd(-8, 8), vy: -rnd(12, 30), t0: S.t, life: 1.4 });
    if (Math.random() < dt * 3) S.parts.push({ k: 'smoke', x: 200 + rnd(-3, 3), y: 42, vx: rnd(-4, 8), vy: -rnd(8, 14), t0: S.t, life: 2.6 });
  }
  S.parts = S.parts.filter(p => S.t - p.t0 < p.life);
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; }
}

/* ---------- art ---------- */
function hash(i, j) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
(function buildBg() {
  const g = bg.getContext('2d');
  const cx = 200, cy = 118;
  const hw = i => 196 - 30 * i, hh = i => 122 - 23 * i, bot = i => 206 - 9 * i;
  const arch = i => {
    g.beginPath(); g.moveTo(cx - hw(i), bot(i)); g.lineTo(cx - hw(i), cy);
    g.ellipse(cx, cy, hw(i), hh(i), 0, Math.PI, 0); g.lineTo(cx + hw(i), bot(i)); g.closePath();
  };
  const bricks = (shade, seed) => {
    const bh = 9, bw = 20;
    for (let r = 0; r * bh < H; r++) {
      const off = (r % 2) * bw / 2;
      for (let k = -1; k * bw < W + bw; k++) {
        const v = hash(k + seed, r + seed);
        g.fillStyle = `hsl(${16 + v * 12},${24 + v * 10}%,${(30 + v * 14) * shade}%)`;
        g.fillRect(k * bw + off + 1, r * bh + 1, bw - 1, bh - 1);
      }
    }
  };
  g.fillStyle = '#0b0708'; g.fillRect(0, 0, W, H);
  bricks(1, 0);
  for (let i = 0; i < 5; i++) {
    g.save(); arch(i); g.clip();
    g.fillStyle = '#0b0708'; g.fillRect(0, 0, W, H);
    bricks(0.88 - 0.14 * i, 11 * (i + 1));
    g.restore();
    arch(i); g.lineWidth = 2; g.strokeStyle = 'rgba(0,0,0,.55)'; g.stroke();
  }
  arch(5);
  const vg = g.createRadialGradient(cx, 150, 4, cx, 150, 60);
  vg.addColorStop(0, '#1a0e0a'); vg.addColorStop(1, '#050303');
  g.fillStyle = vg; g.fill();

  const bands = [[0, bot(0), W, H - bot(0), -1]];
  for (let i = 0; i < 6; i++) bands.push([cx - hw(i), bot(i + 1), hw(i) * 2, bot(i) - bot(i + 1), i]);
  g.save();
  g.beginPath(); bands.forEach(b => g.rect(b[0], b[1], b[2], b[3])); g.clip();
  bands.forEach(b => { g.fillStyle = `hsl(12,13%,${27 - (b[4] + 1) * 2.6}%)`; g.fillRect(b[0], b[1], b[2], b[3]); });
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 1;
  for (let i = 0; i <= 6; i++) { g.beginPath(); g.moveTo(0, bot(i) + .5); g.lineTo(W, bot(i) + .5); g.stroke(); }
  for (let k = -9; k <= 9; k++) { g.beginPath(); g.moveTo(cx + k * 6, 152); g.lineTo(cx + k * 62, H); g.stroke(); }
  const gr = g.createLinearGradient(0, 200, 0, H);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = gr; g.fillRect(0, 200, W, 40);
  g.restore();
})();

    m.mindB.textContent = Math.floor(h.mp);
    m.atbI.style.width = (h.ko ? 0 : h.gauge * 100) + '%';
    m.el.classList.toggle('ready', h.ready && !h.ko);
    m.el.classList.toggle('sel', S.selected === h.id);
    m.el.classList.toggle('down', h.ko);
  }
  if (cmdFor !== S.selected) buildCmds(S.selected);
  const h = heroById(S.selected);
  const st = $('cmdState');
  st.textContent = h.ko ? 'Down' : h.ready ? 'Ready' : 'Charging';
  st.className = h.ready && !h.ko ? '' : 'wait';
  for (const s in cmdRows) {
    cmdRows[s].classList.toggle('no', h.ko || h.mp < SKILLS[s].cost);
    cmdRows[s].classList.toggle('queued', !!(h.queued && h.queued.skill === s));
  }
}

function say(text, bad) {
  const r = $('result');
  r.textContent = '→ ' + text;
  r.classList.toggle('bad', !!bad);
}

/* ---------- speech ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, wantListen = false, blockedMsg = '';
const handled = new Set(), pend = {};
const MIC_OFF = 'Mic off. You can also type or tap commands.';

function setMic(on, msg) {
  $('mic').setAttribute('aria-pressed', String(on));
  $('micLabel').textContent = on ? 'Stop listening' : 'Start listening';
  $('micStatus').textContent = msg;
}

function startMic() {
  if (!SR) { setMic(false, 'This browser has no speech recognition. Try Chrome or Safari, or type commands.'); return; }
  blockedMsg = '';
  wantListen = true;
  rec = new SR();
  rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 3;
  rec.onstart = () => setMic(true, 'Listening. Try “Matthew, block”.');
  rec.onresult = ev => {
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const res = ev.results[i], alts = [];
      for (let k = 0; k < res.length; k++) alts.push(res[k].transcript);
      $('heard').textContent = 'Heard “' + alts[0].trim() + '”';
      if (handled.has(i)) continue;
      clearTimeout(pend[i]);
      const p = alts.map(parseCommand).find(x => x.ok);
      if (p && res.isFinal) { handled.add(i); runParsed(p); }
      else if (p) pend[i] = setTimeout(() => { if (!handled.has(i)) { handled.add(i); runParsed(p); } }, 450);
      else if (res.isFinal) { handled.add(i); say(parseCommand(alts[0]).reason, true); }
    }
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      wantListen = false;
      blockedMsg = 'The microphone is blocked here. Open the game in its own browser tab and allow the mic, or type commands.';
    } else if (ev.error === 'audio-capture') {
      wantListen = false;
      blockedMsg = 'No microphone found. Plug one in, or type commands.';
    }
  };
  rec.onend = () => {
    handled.clear();
    if (wantListen) setTimeout(() => { try { rec.start(); } catch (_) {} }, 250);
    else setMic(false, blockedMsg || MIC_OFF);
  };
  try { rec.start(); } catch (_) { setMic(false, MIC_OFF); }
}

$('mic').addEventListener('click', () => {
  if (wantListen) { wantListen = false; try { rec.stop(); } catch (_) {} setMic(false, MIC_OFF); }
  else startMic();
});

$('typed').addEventListener('submit', ev => {
  ev.preventDefault();
  const inp = $('typedCmd'), text = inp.value.trim();
  if (!text) return;
  $('heard').textContent = 'Typed “' + text + '”';
  const p = parseCommand(text);
  if (p.ok) runParsed(p); else say(p.reason, true);
  inp.value = '';
});

$('wait').addEventListener('change', ev => { S.wait = ev.target.checked; });
$('again').addEventListener('click', () => { newGame(); buildCmds(S.selected); });

/* ---------- boot ---------- */
newGame();
buildParty();
buildCmds(S.selected);
window.__vb = { parseCommand, issue, runParsed, update, get S() { return S; } };

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt); render(); hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
